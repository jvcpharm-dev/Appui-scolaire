<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Appui scolaire</title>
  <meta name="description" content="Suivi des cours de renforcement : présences, horaires et moyennes des élèves.">
  <meta name="theme-color" content="#1f4fbf">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Appui scolaire">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="demo-banner" class="demo-banner" hidden>Mode démonstration : données fictives, rien n'est enregistré.</div>

  <header class="appbar">
    <div class="wrap bar">
      <div class="brand"><span id="brand-logo"></span><div><b>Appui scolaire</b><small id="year"></small></div></div>
      <div id="topright" class="topright"></div>
    </div>
    <nav id="nav" class="nav wrap" role="tablist" aria-label="Sections"></nav>
  </header>

  <main id="app" class="wrap main"></main>

  <!-- Invitation à installer l'application (remplie par js/pwa.js) -->
  <aside id="install" class="install" hidden aria-live="polite"></aside>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="tip"></div>

  <!-- Supabase (client officiel). Sans connexion au premier lancement, l'application l'indique. -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.9"></script>
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/pwa.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
